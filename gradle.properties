org.gradle.caching=true
# Tasks of different projects (server, proto-jvm, e2e) run in parallel.
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
# Mutation testing compiles sources twice and hides them from JaCoCo; it is
# switched on explicitly by scripts/gate.sh (-Pmutflow.enabled=true).
mutflow.enabled=false
