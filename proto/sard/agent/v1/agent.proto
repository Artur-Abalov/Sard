syntax = "proto3";

// Contract between sard-server and sard-agent.
//
// The agent is always the client. On first start it enrolls with a one-time
// token and receives a client certificate; after that it dials the server
// over mTLS, registers, and opens a long-lived bidirectional stream. The
// server never connects to the agent; it sends commands over the stream the
// agent opened. Backup data never travels over this API: the agent writes it
// straight to storage.
//
// Identity: the server identifies the agent (and its tenant) by the mTLS
// client certificate, never by fields in messages.
//
// Trust model (ADR 0008): the server is a control plane, not a key holder.
// It decides when to run which step and refers to repositories, secrets and
// scripts by name only; their definitions and values live on the agent host
// (restic password_file, backend credentials, source passwords, allowlisted
// scripts). A compromised server can trigger or stop steps and see metadata,
// but cannot read backups, learn credentials, redirect data to another
// repository or run arbitrary code on hosts.
package sard.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "dev.sard.proto.agent.v1";

// ---------------------------------------------------------------------------
// Enrollment
// ---------------------------------------------------------------------------

// EnrollmentService is served with server-side TLS only: the agent has no
// client certificate yet.
service EnrollmentService {
  // Enroll exchanges a one-time enrollment token and a certificate signing
  // request for a client certificate. The token decides the tenant the agent
  // belongs to; the agent cannot choose it.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // One-time token created in the UI or CLI.
  string enrollment_token = 1;
  // PKCS#10 certificate signing request, DER-encoded. The private key never
  // leaves the agent host.
  bytes csr_der = 2;
  // Host name as reported by the operating system.
  string hostname = 3;
}

message EnrollResponse {
  // Server-assigned agent id, also embedded in the certificate.
  string agent_id = 1;
  // Issued client certificate followed by intermediates, PEM.
  string certificate_chain_pem = 2;
  // CA bundle the agent uses to verify the server from now on, PEM.
  string ca_bundle_pem = 3;
}

// ---------------------------------------------------------------------------
// Agent service (mTLS required)
// ---------------------------------------------------------------------------

// AgentService is implemented by sard-server and called by sard-agent.
// Every call requires a client certificate issued by Enroll.
service AgentService {
  // Register announces the agent and its capabilities. Called on every
  // agent start. Fails with FAILED_PRECONDITION if protocol_version is not
  // supported by the server.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Connect is the command channel. The agent opens it after Register and
  // keeps it open; the first message must be Hello. Heartbeats, progress,
  // logs and results flow up, commands flow down. On disconnect the agent
  // reconnects with backoff and sends Hello again.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);

  // RenewCertificate issues a new client certificate before the current one
  // expires.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // ConfirmCertificate tells the server that the agent holds the certificate
  // it presents, a renewed one, and works with it. The agent calls it over a
  // separate connection that presents the new pair. Until then the new
  // certificate authenticates only this call; afterwards the server rejects
  // the certificate it replaced (CERT_SUPERSEDED), while a stream already
  // open with it stays open. Repeating the call, or calling it with a
  // certificate that replaced none, succeeds and changes nothing. The agent
  // is identified by the certificate; the messages are empty.
  rpc ConfirmCertificate(ConfirmCertificateRequest) returns (ConfirmCertificateResponse);

  // Probe tells the agent whether the server accepts its certificate and what
  // time the server has. Read-only: it does not register, open a session, mark
  // the agent seen or touch its steps. Refusals are those of every
  // AgentService call (ADR 0009): UNAUTHENTICATED with google.rpc.ErrorInfo,
  // domain "sard.dev". Servers older than this method answer UNIMPLEMENTED to
  // an accepted agent.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

// ProbeRequest carries nothing: the server knows the agent by its
// certificate (ADR 0009).
message ProbeRequest {}

message ProbeResponse {
  // Server clock when it answered; the agent compares it with its own clock,
  // corrected for half the round trip.
  google.protobuf.Timestamp server_time = 1;
}

// RegisterRequest describes the agent to the server.
message RegisterRequest {
  // Host name as reported by the operating system; shown in the UI.
  string hostname = 1;
  // Version of the sard-agent binary, e.g. "0.1.0" or a git describe string.
  string agent_version = 2;
  // Source plugins compiled into this agent.
  repeated Plugin plugins = 3;
  // Version of this contract the agent speaks. Starts at 1; bumped on
  // behavioural changes that field numbers alone cannot express.
  uint32 protocol_version = 4;
  // Operating system and architecture, e.g. "linux", "amd64".
  string os = 5;
  string arch = 6;
  // Repositories configured on this host; names and metadata only.
  repeated RepositoryInfo repositories = 7;
  // Names of secrets available on this host; values never leave it. Lets
  // the UI show which configurations can run on which agent.
  repeated string secret_names = 8;
  // Names of scripts allowlisted on this host for ACTION_RUN.
  repeated string script_names = 9;
  // Stable identifier of the host: lowercase hex of
  // HMAC-SHA256(key = "sard-machine-id/v1" || tenant_id, data = raw machine
  // id), exactly 64 characters. Required; lets the server tell that two
  // agents of different roles share one machine. The raw id never leaves
  // the host.
  string machine_id = 10;
  // What a verifier can offer restore verification (V4). Set by every agent
  // of this version or later, whatever its role; absent from an older agent,
  // which the server never hands a verification. A verifier's keys are the
  // repository_id of its repositories, its plugins those that list
  // ACTION_VERIFY.
  VerifierStatus verifier = 11;
  // Absolute path of the directory the host's operator allows restores into
  // (restore.dir in the agent config), shown in the console. Not a secret;
  // the server cannot set or change it and never sends a path of its own in a
  // command. Empty for an agent that cannot restore from the console.
  string restore_dir = 12;
}

// VerifierStatus is what a verifier reports about its own host for restore
// verification: what it has, never a secret.
message VerifierStatus {
  // Free bytes in the directory where verifications restore; absent when the
  // agent does not know (yet).
  optional uint64 work_free_bytes = 1;
  // Container runtime available for the verification sandbox.
  Sandbox sandbox = 2;
}

// Sandbox is the container runtime a verifier can start a sandbox with.
enum Sandbox {
  // Not reported or not known.
  SANDBOX_UNSPECIFIED = 0;
  // Neither Docker nor Podman was found.
  SANDBOX_NONE = 1;
  SANDBOX_DOCKER = 2;
  SANDBOX_PODMAN = 3;
}

// Plugin is a source plugin available on the agent.
message Plugin {
  // Unique plugin name, e.g. "postgresql".
  string name = 1;
  // JSON Schema (draft 2020-12) of the plugin configuration; the UI renders
  // configuration forms from it. Secret fields hold the name of a secret
  // stored on the agent host (e.g. "password_ref": "pg-prod"), never a value.
  string config_schema = 2;
  // Plugin version, e.g. "0.1.0".
  string version = 3;
  // Actions the plugin implements.
  repeated Action actions = 4;
  // JSON Schema (draft 2020-12) of the configuration of ACTION_RESTORE, which
  // the console renders and the server validates before it sends the
  // command. Empty: the plugin cannot be restored from the console.
  string restore_config_schema = 5;
}

// RegisterResponse identifies the agent in all later calls.
message RegisterResponse {
  // Server-assigned agent id, for logs and diagnostics. The server itself
  // identifies the agent by its certificate.
  string agent_id = 1;
  // How often the agent must send Heartbeat.
  google.protobuf.Duration heartbeat_interval = 2;
}

message RenewCertificateRequest {
  // New CSR, DER-encoded; must carry a new key: a CSR for the key of the
  // presented certificate is rejected (CSR_KEY_REUSED).
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  // The new certificate chain in the same form as
  // EnrollResponse.certificate_chain_pem. The expiry is read from the
  // certificate.
  string certificate_chain_pem = 1;
}

// ConfirmCertificateRequest is empty: the presented certificate names the agent.
message ConfirmCertificateRequest {}

// ConfirmCertificateResponse is empty: success is the OK status.
message ConfirmCertificateResponse {}

// ---------------------------------------------------------------------------
// Stream: agent -> server
// ---------------------------------------------------------------------------

// ConnectRequest is one message from the agent to the server.
message ConnectRequest {
  oneof message {
    // Periodic liveness signal.
    Heartbeat heartbeat = 1;
    // Final outcome of a command previously received from the server.
    StepResult step_result = 2;
    // First message on every stream.
    Hello hello = 3;
    // Intermediate state of a running command.
    StepProgress step_progress = 4;
    // Log output of a running command.
    LogChunk log_chunk = 5;
  }
}

// Hello opens the stream and lets the server reconcile state after a
// reconnect.
message Hello {
  // Commands queued or running on the agent. The server must not resend the
  // listed ones. A command the server believes running but absent here
  // becomes lost ("agent lost the step", its run fails) unless its result
  // arrives within one loss window; one it dispatched but absent here is
  // sent again (ADR 0038).
  repeated string running_command_ids = 1;
}

// Heartbeat tells the server the agent is alive.
message Heartbeat {
  reserved 1;
  reserved "agent_id";
  // Agent clock at send time; lets the server detect clock skew.
  google.protobuf.Timestamp sent_at = 2;
  // The verifier's status now, as in RegisterRequest.verifier; absent when
  // unchanged or unknown.
  VerifierStatus verifier = 3;
}

// StepProgress reports that a command is accepted or advancing.
message StepProgress {
  string command_id = 1;
  StepPhase phase = 2;
  // Bytes processed so far in the current phase.
  uint64 bytes_processed = 3;
  // Expected total bytes; 0 when unknown.
  uint64 bytes_total = 4;
  google.protobuf.Timestamp sent_at = 5;
  // Files processed so far in the current phase; 0 when the phase counts no
  // files or restic has not reported any yet.
  uint64 files_processed = 6;
  // Expected total files; 0 when unknown.
  uint64 files_total = 7;
  // A verification stage that has just finished (ACTION_VERIFY only); the
  // final VerifyOutput repeats every stage.
  VerifyStage stage = 8;
}

// StepPhase follows the plugin interface prepare -> dump -> stream -> verify.
enum StepPhase {
  STEP_PHASE_UNSPECIFIED = 0;
  // The agent accepted the command and queued it.
  STEP_PHASE_ACCEPTED = 1;
  STEP_PHASE_PREPARING = 2;
  STEP_PHASE_DUMPING = 3;
  // Data is being written to the repository.
  STEP_PHASE_UPLOADING = 4;
  STEP_PHASE_RESTORING = 5;
  STEP_PHASE_VERIFYING = 6;
}

// LogChunk carries log lines of one command, batched by the agent.
message LogChunk {
  string command_id = 1;
  repeated LogLine lines = 2;
}

message LogLine {
  google.protobuf.Timestamp time = 1;
  LogLevel level = 2;
  // Must not contain secrets; the agent redacts known secret values.
  string text = 3;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

// StepResult reports how a RunStep command ended. Sent once per command_id
// and stream; the agent keeps it and sends it again on every new stream
// until the server confirms it with ResultAck.
message StepResult {
  reserved 4;
  reserved "snapshot_id";

  // Id of the command this result answers.
  string command_id = 1;
  // Final state of the step.
  StepStatus status = 2;
  // Human-readable detail; empty on success.
  string message = 3;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;

  // Action-specific output; unset when the step failed before producing it.
  oneof output {
    BackupOutput backup = 10;
    RestoreOutput restore = 11;
    VerifyOutput verify = 12;
    RunOutput run = 13;
  }

  // Machine-readable reason for STEP_STATUS_REJECTED; unspecified otherwise.
  RejectReason reject_reason = 14;
}

// RejectReason says why an agent refused to start a step.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  // The action is not allowed for the role in the agent's own certificate:
  // a source runs BACKUP, RESTORE and RUN; a verifier runs only VERIFY.
  REJECT_REASON_ROLE_MISMATCH = 1;
}

// StepStatus is the final state of a step.
enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  // The step finished successfully.
  STEP_STATUS_SUCCEEDED = 1;
  // The step failed; see StepResult.message.
  STEP_STATUS_FAILED = 2;
  // Cancelled by CancelStep.
  STEP_STATUS_CANCELLED = 3;
  // Exceeded RunStep.timeout.
  STEP_STATUS_TIMED_OUT = 4;
  // Not started: unknown plugin, repository, secret or script, unsupported
  // action or invalid config.
  STEP_STATUS_REJECTED = 5;
}

message BackupOutput {
  // Snapshot id in the repository.
  string snapshot_id = 1;
  // Logical size of the backed-up data.
  uint64 total_bytes = 2;
  // Bytes actually added to the repository after deduplication.
  uint64 added_bytes = 3;
  // restic's id of the repository the snapshot is in (64 lower-case hex
  // characters), as in RepositoryInfo.repository_id; not a secret.
  string repository_id = 4;
}

// RestoreOutput is the outcome of ACTION_RESTORE. A restore is all or
// nothing: on SUCCEEDED every field but leftover is set; on any other
// status the output exists only when the rollback failed, and then holds
// leftover alone.
message RestoreOutput {
  // Where the data was restored: the absolute path of a directory, or the
  // name of a database.
  string target = 1;
  // Files and bytes written to the target, as restic reports them.
  uint64 files_restored = 2;
  uint64 bytes_restored = 3;
  // Name of the database a PostgreSQL restore created.
  string database = 4;
  // Tables and roles a PostgreSQL restore created.
  uint64 tables_restored = 5;
  uint64 roles_restored = 6;
  // Whether the owners and groups of the snapshot were restored. False for
  // files: the service user is not privileged, so everything it writes is
  // its own.
  bool owners_restored = 7;
  // What the rollback of a failed restore could not remove and the operator
  // must remove by hand: a path, "database <name>", "role <name>".
  string leftover = 8;
}

// VerifyOutput is the evidence behind "last verified restore N hours ago".
message VerifyOutput {
  // Snapshot that was restored and checked.
  string snapshot_id = 1;
  repeated CheckResult checks = 2;
  // Stages in the order they ran; the pipeline stops at the first that does
  // not pass.
  repeated VerifyStage stages = 3;
  // The verifier's verdict. Unspecified from an agent that sends none: the
  // server then records "cannot verify".
  VerifyVerdict verdict = 4;
  // Differences between the source's fingerprint and the copy's.
  repeated FingerprintMismatch mismatches = 5;
  // Time to restore: the sum of the stages' durations (level 5).
  google.protobuf.Duration restore_duration = 6;
}

// VerifyStage is one stage of the verification pipeline and its evidence.
message VerifyStage {
  // Level the stage proves (1 storage integrity, 2 extraction, 3 the
  // application starts, 4 the data matches the fingerprint); 0 for
  // preparation and cleanup, which prove no level.
  uint32 level = 1;
  // Stage name, e.g. "fingerprint_tag", "restic_check", "restore".
  string name = 2;
  StageStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  // Exit code of the stage's command; 0 when it ran none.
  int32 exit_code = 6;
  // Tail of the command's output, redacted on the agent.
  string output = 7;
  // Digest of the sandbox image, e.g. "sha256:..."; empty without one.
  string image_digest = 8;
}

enum StageStatus {
  STAGE_STATUS_UNSPECIFIED = 0;
  STAGE_STATUS_PASSED = 1;
  // The backup is bad: the stage found it so.
  STAGE_STATUS_FAILED = 2;
  // The stage could not run here (missing extension, too little disk).
  STAGE_STATUS_CANNOT_RUN = 3;
  // The stage does not apply to this source, e.g. level 3 for files.
  STAGE_STATUS_NOT_APPLICABLE = 4;
}

// VerifyVerdict is the verifier's conclusion; "infrastructure failure" and
// "no verifier" are the server's own and never sent.
enum VerifyVerdict {
  VERIFY_VERDICT_UNSPECIFIED = 0;
  // Every stage passed and the fingerprints match.
  VERIFY_VERDICT_PASSED = 1;
  // A stage failed or the fingerprints differ: the backup is bad.
  VERIFY_VERDICT_FAILED = 2;
  // The verifier's environment could not run the check.
  VERIFY_VERDICT_CANNOT_VERIFY = 3;
}

// FingerprintMismatch is one fact that differs between the source and the
// restored copy.
message FingerprintMismatch {
  // Fact name, e.g. "tables_count" or "count(public.orders)".
  string name = 1;
  string expected = 2;
  string actual = 3;
}

message CheckResult {
  // Check name, e.g. "tables_count" or a user-defined SQL check.
  string name = 1;
  bool passed = 2;
  // Observed value or failure reason.
  string detail = 3;
}

message RunOutput {
  // Exit code of a user script or hook.
  int32 exit_code = 1;
}

// ---------------------------------------------------------------------------
// Stream: server -> agent
// ---------------------------------------------------------------------------

// ConnectResponse is one message from the server to the agent.
message ConnectResponse {
  oneof message {
    // Execute one workflow step.
    RunStep run_step = 1;
    // Stop a running step.
    CancelStep cancel_step = 2;
    // The server has durably recorded a StepResult.
    ResultAck result_ack = 3;
  }
}

// ResultAck confirms a StepResult. The server sends it only after the
// result is durably recorded (its transaction committed), and also for a
// command_id it does not know, so that the agent stops resending it. After
// ResultAck the agent drops the stored result and never sends it again; it
// ignores a ResultAck for a command_id it holds no result for. A result
// without ResultAck is resent on the next stream, so the server must treat
// a repeated StepResult for a closed command as a no-op and ack it again.
message ResultAck {
  // Id of the command whose result is recorded.
  string command_id = 1;
}

// Action is what a step does with a plugin.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_BACKUP = 1;
  ACTION_RESTORE = 2;
  // Restore into a temporary sandbox and run checks.
  ACTION_VERIFY = 3;
  // Run a script allowlisted on the agent host; no repository involved.
  ACTION_RUN = 4;
}

// RunStep asks the agent to execute one workflow step with a plugin.
//
// Idempotency: command_id is unique. If the agent receives a command_id it
// is already running or has finished, it must not run it again; it reports
// the current progress or resends the stored result instead.
message RunStep {
  reserved 5, 6;
  reserved "repository", "secrets";

  // Server-generated id; echoed in every progress, log and result message.
  string command_id = 1;
  // Name of the plugin that executes the step, e.g. "postgresql".
  string plugin = 2;
  // Plugin configuration as JSON, valid against the plugin's config_schema.
  // Secrets appear only as names of agent-local secrets, so it holds no
  // secret values and may be logged. For ACTION_RUN it names an allowlisted
  // script, never script text.
  string config_json = 3;
  Action action = 4;
  // Name of a repository configured on the agent host; empty for
  // ACTION_RUN. URL, restic password_file and backend credentials stay on
  // the host.
  string repository_name = 10;
  // Snapshot to restore or verify; empty means the latest snapshot matching
  // tags.
  string snapshot_id = 7;
  // Hard limit for the whole step; the agent kills it after this.
  google.protobuf.Duration timeout = 8;
  // Tags written to the snapshot, e.g. workflow and run ids.
  map<string, string> tags = 9;
  // What a verification needs besides snapshot_id (ACTION_VERIFY only). No
  // secret: the verifier opens the repository with its own key.
  VerifyTask verify = 11;
}

// VerifyTask is the verification job a VERIFY step carries out.
message VerifyTask {
  // Server id of the verification job; the step's command_id differs on
  // every attempt.
  string job_id = 1;
  // restic id of the repository, as in RepositoryInfo.repository_id.
  string repository_id = 2;
  // The source's fingerprint as the backup reported it; empty when there is
  // none.
  bytes fingerprint = 3;
  // Lower-case hex SHA-256 of fingerprint, compared with the snapshot's tag;
  // empty when there is no fingerprint.
  string fingerprint_sha256 = 4;
  // When the job expires.
  google.protobuf.Timestamp deadline = 5;
}

// RepositoryInfo is a repository configured on the agent host, as reported
// in Register. It carries no URL credentials and no restic password.
message RepositoryInfo {
  // Name the server uses in RunStep.repository_name.
  string name = 1;
  // Backend kind, e.g. "s3", "sftp", "local".
  string backend = 2;
  // restic repository id (from the repository config), not a secret. Lets
  // the server see how many agents can open the same repository and warn
  // when the key exists on a single host only.
  string repository_id = 3;
  // Crypto provider; empty means restic built-in AES. Reserved for GOST.
  string crypto_provider = 4;
}

// CancelStep asks the agent to stop a running step. The agent answers with
// StepResult status CANCELLED, or with the real result if the step had
// already finished.
message CancelStep {
  string command_id = 1;
}
