# Copyright 2026 Artur Abalov
#
# Release for a tag vX.Y.Z or a pre-release vX.Y.Z-beta.N / vX.Y.Z-rc.N
# (docs/adr/0043-agent-release.md, ADR 0039, docs/adr/0048-release-versions.md):
#
#   version     (the tag is a release tag, else nothing is built)
#   build ×2 ─┬─ reproduce  (two independent builds, same SHA256SUMS; tamper tests)
#             │     └─ sbom-packages (CycloneDX SBOM per architecture, into SHA256SUMS)
#   server-jar┼─ install    (deb on Debian/Ubuntu, rpm on Rocky, systemd: install, enroll, upgrade)
#             └─ e2e        (test/e2e against the image of these packages and this jar)
#                   └─ sign     (environment "release": minisign over SHA256SUMS, SBOMs included)
#                         ├─ publish  (GitHub release with the signed files; "-" makes it a pre-release;
#                         │            build provenance of every file, GitHub attestation)
#                         └─ image    (sard-server for amd64 and arm64: the tested jar, console
#                               │      included, and the signed packages; sard-agent of the same
#                               │      signed tarballs, the agent next to the server; GHCR;
#                               │      images.json with their digests; build provenance)
#                               ├─ sbom-images (CycloneDX SBOM per image and architecture)
#                               └─ offline ×2 (docker save of sard-server, sard-agent + PostgreSQL per arch)
#                                     └─ assets (offline archives, compose file, env template,
#                                           │    images.json, image SBOMs, SHA256SUMS.server)
#                                           └─ sign-server (environment "release", second approval:
#                                                 │   cosign over the images and their SBOMs,
#                                                 │   minisign over SHA256SUMS.server)
#                                                 └─ server-assets (→ the release)
#                                                       ├─ verify-quickstart ×2 (README quickstart,
#                                                       │     the image check of docs/operator, clean runner)
#                                                       └─ verify-offline ×2    (archive, signatures checked
#                                                             without network, --pull never)
#
# Build once, test that (docs/adr/0045-build-once.md): the packages of "build a"
# and the jar of "server-jar" are what install and e2e test, what sign signs and
# what image publishes; no later job compiles either again. "build b" exists only
# to prove the packages reproducible; dist-old in install is a fixture (an older
# version to upgrade from), and so is the e2e stand's agent (ADR 0036).
# The signed SHA256SUMS covers the agent packages only; the server assets have
# their own SHA256SUMS.server. The image carries the signed packages, and the
# server serves them (docs/release.md).
# Trust: the minisign and cosign keys are secrets of the "release"
# environment, which only v* tags may use and which waits for the owner's
# approval: once for sign, once for sign-server (scripts/check-workflow-secrets.sh
# keeps them there). Build provenance is a GitHub attestation (Sigstore,
# keyless), an extra an operator may check online; the signatures an operator
# must check are the key-based ones, which work without network (SC1). Pull requests
# (from forks too) never run this workflow; no job uses pull_request_target.
# Every third-party action is pinned to a commit; the signing job runs only
# minisign from the runner's apt and scripts/release-sign.sh of the tagged
# commit. Anyone who can push a v* tag or change main can change what is
# signed: both are restricted to the owner (docs/release.md).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # The tag pattern above lets through v0.0.1-rc1 and the like; this job is
  # the rule (scripts/release-version.sh), and every other job waits for it.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag is a release tag
        run: scripts/release-version.sh check "$VERSION"
      # Both public keys an operator checks the release with are in the tagged commit (SC1, D24).
      - name: the release keys are published
        run: scripts/check-identity.sh --keys

  build:
    name: build ${{ matrix.build }}
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        build: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - name: rpm and gpg
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg
      # restic is accepted only with SHA256SUMS signed by the key of the
      # fingerprint pinned in agent/internal/restic/restic-version (ADR 0017,
      # SC1): fetch-restic.sh checks the signer on every build.
      - name: package
        env:
          REQUIRE_RPM: "1"
        run: make package VERSION="$VERSION"
      # Never shipped: the T3 e2e classes run it (ADR 0036).
      - name: e2e stand's agent
        if: matrix.build == 'a'
        run: make package-stand VERSION="$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.build == 'a'
        with:
          name: stand
          path: test/e2e/build/stand-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.build }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error

  # The only build of the server jar (console included) of this release.
  server-jar:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: server jar
        run: make server-jar VERSION="$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-jar
          path: build/server-jar/sard-server.jar
          if-no-files-found: error

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-*
          path: builds
      - name: two builds, one SHA256SUMS
        run: diff builds/dist-a/SHA256SUMS builds/dist-b/SHA256SUMS
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: forgeries are refused (throwaway key)
        run: scripts/test-release-signing.sh builds/dist-a "$VERSION"

  # What the packages of each architecture ship (sard-agent, restic), for the
  # operator and for scanners; SHA256SUMS is written anew over them, so sign
  # signs the SBOMs with the packages.
  sbom-packages:
    needs: reproduce
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-a
          path: dist
      - name: SBOM per architecture (syft, CycloneDX)
        run: scripts/release-sbom.sh packages dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-sbom
          path: dist/
          if-no-files-found: error

  install:
    needs: [build, server-jar]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # deb on Debian/Ubuntu, rpm on Rocky (scripts/test-agent-install.sh).
        distro: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "rockylinux/rockylinux:9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-a
          path: dist-new
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-jar
          path: build/server-jar
      # The version upgraded from: the same commit as an older package
      # (0.0.0~dev… sorts below any release), so the upgrade path is this
      # release's own install and remove scripts.
      - name: package to upgrade from
        run: make package DIST="$PWD/dist-old" VERSION=upgrade-base
      - name: server image of the release's jar and packages
        run: make server-image DIST=dist-new SERVER_IMAGE=sard-server:e2e VERSION="$VERSION"
      - name: install, enroll, upgrade
        run: OLD_DIST=dist-old NEW_DIST=dist-new scripts/test-agent-install.sh "${{ matrix.distro }}"
      # The commands the console shows (U1b), run as the server answers them.
      - name: install and upgrade by the console's steps
        run: |
          scripts/test-console-install.sh "${{ matrix.distro }}"
          UPGRADE=1 OLD_DIST=dist-old scripts/test-console-install.sh "${{ matrix.distro }}"

  e2e:
    needs: [build, server-jar]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Kotlin test class file names are Cyrillic; the JVM takes the file-name encoding from the locale.
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-a
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stand
          path: test/e2e/build/stand-dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-jar
          path: build/server-jar
      - name: images of the release's jar and packages
        run: make e2e-assemble DIST=dist VERSION="$VERSION"
      - name: e2e tests
        run: make e2e-test VERSION="$VERSION"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            test/e2e/build/e2e-logs/
            test/e2e/build/reports/tests/
          if-no-files-found: ignore

  sign:
    needs: [sbom-packages, install, e2e]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-sbom
          path: dist
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: scripts/release-sign.sh dist "$VERSION"
      - name: verify with the published key
        run: scripts/release-verify.sh dist "$VERSION" deploy/release/sard-release.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance of the release files (GitHub attestation, Sigstore).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: verify again
        run: scripts/release-verify.sh dist "$VERSION" deploy/release/sard-release.pub
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" "${prerelease[@]}" \
            --notes "Signed with the Sard release key (deploy/release/sard-release.pub, docs/release.md). Verify: minisign -Vm SHA256SUMS -p sard-release.pub && sha256sum -c SHA256SUMS. Images: cosign verify --key cosign.pub (docs/operator/10-security.md)." \
            dist/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  image:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Build provenance of the images (GitHub attestation, Sigstore), pushed next to them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: verify again
        run: scripts/release-verify.sh dist "$VERSION" deploy/release/sard-release.pub
      # The jar install and e2e tested: the image is assembled from it, nothing is compiled.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-jar
          path: build/server-jar
      # vX.Y.Z-pre and X.Y.Z-pre always; X.Y and latest only for a release.
      - name: image tags
        run: |
          . deploy/release/identity.env
          image="$SARD_REGISTRY_SERVER"
          agent="$SARD_REGISTRY_AGENT"
          plain="$(scripts/release-version.sh image "$VERSION")"
          tags="$image:$VERSION,$image:$plain"
          agent_tags="$agent:$VERSION,$agent:$plain"
          pg_tags="$agent:$VERSION-pg18,$agent:$plain-pg18"
          if [[ "$VERSION" != *-* ]]; then
            tags="$tags,$image:${plain%.*},$image:latest"
            agent_tags="$agent_tags,$agent:${plain%.*},$agent:latest"
            pg_tags="$pg_tags,$agent:${plain%.*}-pg18,$agent:latest-pg18"
          fi
          { echo "IMAGE=$image"; echo "TAGS=$tags"; echo "AGENT_IMAGE=$agent"; echo "AGENT_TAGS=$agent_tags"; } >>"$GITHUB_ENV"
          echo "AGENT_PG_TAGS=$pg_tags" >>"$GITHUB_ENV"
      # The runtime stage runs useradd for arm64; the package check runs once,
      # natively, and the jar comes from the server-jar job (deploy/server/Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The server hands out exactly these signed files (deploy/server/Dockerfile).
      - name: build and push sard-server for amd64 and arm64
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SARD_VERSION=${{ env.VERSION }}
          build-contexts: server-jar=build/server-jar
          push: true
          tags: ${{ env.TAGS }}
      - name: the published image carries the signed packages, on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint test "$IMAGE:$VERSION" \
              -f /usr/share/sard/agent-packages/SHA256SUMS.minisig
          done
      # The agent next to the server in docker-compose.yml (docs/operations/self-agent.md):
      # the same version, unpacked from the signed tarballs verified above.
      - name: build and push sard-agent for amd64 and arm64
        id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: deploy/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SARD_VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.AGENT_TAGS }}
      # The same agent on the pinned PostgreSQL (F6, deploy/postgres.env): docker-compose.yml's sard-self dumps
      # the database with its pg_dump, of the server's version.
      - name: the pinned base of the -pg18 agent
        run: grep '^SARD_AGENT_PG_BASE_IMAGE=' deploy/postgres.env >> "$GITHUB_ENV"
      - name: build and push sard-agent -pg18 for amd64 and arm64
        id: agent-pg
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: deploy/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            SARD_VERSION=${{ env.VERSION }}
            BASE_IMAGE=${{ env.SARD_AGENT_PG_BASE_IMAGE }}
          push: true
          tags: ${{ env.AGENT_PG_TAGS }}
      - name: the published agent images are this version, on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$AGENT_IMAGE:$VERSION" --version | grep -qx "sard-agent $VERSION"
            docker run --rm --platform "$platform" "$AGENT_IMAGE:$VERSION-pg18" --version | grep -qx "sard-agent $VERSION"
            docker run --rm --platform "$platform" --entrypoint /usr/lib/postgresql/18/bin/pg_dump \
              "$AGENT_IMAGE:$VERSION-pg18" --version | grep -q "PostgreSQL) 18\."
          done
      # What sign-server signs and an operator verifies: every image by the digest of its index.
      - name: images.json
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          AGENT_PG_DIGEST: ${{ steps.agent-pg.outputs.digest }}
        run: |
          mkdir -p images
          jq -n --arg version "$VERSION" --arg server "$IMAGE" --arg agent "$AGENT_IMAGE" \
            --arg sd "$SERVER_DIGEST" --arg ad "$AGENT_DIGEST" --arg pd "$AGENT_PG_DIGEST" \
            --arg st "$TAGS" --arg at "$AGENT_TAGS" --arg pt "$AGENT_PG_TAGS" '
            def tags($t): $t | split(",") | map(split(":") | last);
            {version: $version, images: [
              {name: $server, sbom: "sard-server", digest: $sd, tags: tags($st)},
              {name: $agent, sbom: "sard-agent-image", digest: $ad, tags: tags($at)},
              {name: $agent, sbom: "sard-agent-pg18-image", digest: $pd, tags: tags($pt)}]}' >images/images.json
          jq -e '[.images[].digest | test("^sha256:[0-9a-f]{64}$")] | all' images/images.json
          cat images/images.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: images/images.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.AGENT_IMAGE }}
          subject-digest: ${{ steps.agent.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.AGENT_IMAGE }}
          subject-digest: ${{ steps.agent-pg.outputs.digest }}
          push-to-registry: true

  sbom-images:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: images
          path: images
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: SBOM per image and architecture (syft, CycloneDX)
        run: |
          jq -r '.images[] | "\(.sbom) \(.name)@\(.digest)"' images/images.json | while read -r name ref; do
            scripts/release-sbom.sh image sbom "$name" "$ref"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-images
          path: sbom/
          if-no-files-found: error

  offline:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/offline-archive.sh "${VERSION#v}" "${{ matrix.arch }}" offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-${{ matrix.arch }}
          path: offline/
          if-no-files-found: error

  # The server assets, put together and summed; signed only by sign-server.
  assets:
    needs: [offline, sbom-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: offline-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: images
          path: assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sbom-images
          path: assets
      # docker-compose.yml, sard.env.example and the files of deploy/db/ (db-init.sh, bootstrap.sql, pg_hba.conf,
      # postgres-entrypoint.sh): the compose file's ./db/<name> is the asset <name> (DB2, README quickstart).
      - name: compose file, db files, env template of this version, checksums
        run: |
          scripts/release-server-files.sh assets "$VERSION"
          (cd assets && sha256sum -- * >SHA256SUMS.server && cat SHA256SUMS.server)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-assets-unsigned
          path: assets/
          if-no-files-found: error

  # The second job with the keys (environment "release", the owner approves it
  # too): what exists only after image and offline. No code of its own runs
  # here, only cosign and minisign through scripts/release-cosign.sh and
  # scripts/release-sign.sh of the tagged commit.
  sign-server:
    needs: assets
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      # cosign writes the signatures and attestations next to the images.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-assets-unsigned
          path: assets
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: the assets are what assets summed
        run: (cd assets && sha256sum --check --strict --quiet SHA256SUMS.server)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: cosign over the images and their SBOMs
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          scripts/release-cosign.sh sign assets/images.json
          scripts/release-cosign.sh attest assets/images.json assets
      - name: sign SHA256SUMS.server
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: scripts/release-sign.sh assets "$VERSION" SHA256SUMS.server
      - name: verify with the published keys
        run: |
          scripts/release-cosign.sh verify assets/images.json deploy/release/cosign.pub
          scripts/release-verify-server.sh assets "$VERSION" deploy/release/sard-release.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-assets
          path: assets/
          if-no-files-found: error

  server-assets:
    needs: [publish, sign-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-assets
          path: assets
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: verify again
        run: scripts/release-verify-server.sh assets "$VERSION" deploy/release/sard-release.pub
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" assets/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

  verify-quickstart:
    # The README quickstart, run verbatim (only SARD_TAG is set to this tag)
    # on a clean runner with Docker, anonymously against the public registry.
    needs: server-assets
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the quickstart from README.md
        run: |
          awk '/<!-- quickstart:begin -->/{f=1; next} /<!-- quickstart:end -->/{f=0} f' README.md \
            | awk '/^```bash$/{f=1; next} /^```$/{f=0} f' \
            | sed "s/^SARD_TAG=.*/SARD_TAG=$VERSION/" >"$RUNNER_TEMP/quickstart.sh"
          grep -q "^SARD_TAG=$VERSION$" "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
      - name: Run the quickstart
        run: |
          start=$(date +%s)
          bash -euo pipefail "$RUNNER_TEMP/quickstart.sh"
          echo "quickstart took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: scripts/smoke-server.sh ~/sard/.env "$VERSION"
      # The image check of docs/operator/10-security.md, run verbatim (only
      # SARD_TAG is set): signatures and SBOM attestations with the key from
      # the repository at this tag; cosign from the image pinned in tools/images.env.
      - name: Verify the images as docs/operator says
        run: |
          awk '/<!-- verify-image:begin -->/{f=1; next} /<!-- verify-image:end -->/{f=0} f' docs/operator/10-security.md \
            | awk '/^```bash$/{f=1; next} /^```$/{f=0} f' \
            | sed "s/^SARD_TAG=.*/SARD_TAG=$VERSION/" >"$RUNNER_TEMP/verify-image.sh"
          grep -q "^SARD_TAG=$VERSION$" "$RUNNER_TEMP/verify-image.sh"
          cat "$RUNNER_TEMP/verify-image.sh"
          . tools/images.env
          export TOOL_IMAGE_COSIGN
          cosign() { docker run --rm -v "$PWD:/w:ro" -w /w "$TOOL_IMAGE_COSIGN" "$@"; }
          export -f cosign
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          bash -euo pipefail "$RUNNER_TEMP/verify-image.sh"
      - if: failure()
        run: cd ~/sard && docker compose logs --no-color

  verify-offline:
    # The offline archive from the release: checksums, docker load, start
    # with --pull never, so not a single image comes from a registry.
    needs: server-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release assets
        run: |
          mkdir -p "$RUNNER_TEMP/offline" && cd "$RUNNER_TEMP/offline"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "sard-${VERSION#v}-images-linux-${{ matrix.arch }}.tar.gz" \
            --pattern docker-compose.yml --pattern sard.env.example \
            --pattern db-init.sh --pattern bootstrap.sql --pattern pg_hba.conf --pattern postgres-entrypoint.sh \
            --pattern SHA256SUMS.server --pattern SHA256SUMS.server.minisig
          # As docs/operator/11-offline.md: the public key from the repository at this tag.
          curl -fsSLO "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/deploy/release/sard-release.pub"
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      # The check of docs/operator/11-offline.md, run verbatim in a network
      # namespace of its own: no network at all, only the files and the key.
      - name: Verify the signature and sums without network, as docs/operator says
        working-directory: ${{ runner.temp }}/offline
        run: |
          awk '/<!-- offline-verify:begin -->/{f=1; next} /<!-- offline-verify:end -->/{f=0} f' \
            "$GITHUB_WORKSPACE/docs/operator/11-offline.md" | awk '/^```bash$/{f=1; next} /^```$/{f=0} f' >"$RUNNER_TEMP/offline-verify.sh"
          grep -q minisign "$RUNNER_TEMP/offline-verify.sh"
          cat "$RUNNER_TEMP/offline-verify.sh"
          sudo unshare --net bash -c '
            set -euo pipefail
            if curl -fsS --max-time 5 -o /dev/null https://github.com; then echo "network reachable" >&2; exit 1; fi
            bash -euo pipefail "$1" | tee "$2"' _ "$RUNNER_TEMP/offline-verify.sh" "$RUNNER_TEMP/offline-verify.out"
          grep -q "Trusted comment: sard-server $VERSION$" "$RUNNER_TEMP/offline-verify.out"
      # The installation of docs/operator/11-offline.md, run verbatim: the files of the release are put where the
      # compose file looks for them (db/), so a file that the page forgets to copy fails here, not at the operator's.
      - name: Load and install as docs/operator says
        run: |
          ln -s "$RUNNER_TEMP/offline" ~/sard-offline
          awk '/<!-- offline-install:begin -->/{f=1; next} /<!-- offline-install:end -->/{f=0} f' \
            "$GITHUB_WORKSPACE/docs/operator/11-offline.md" | awk '/^```bash$/{f=1; next} /^```$/{f=0} f' >"$RUNNER_TEMP/offline-install.sh"
          grep -q 'docker load' "$RUNNER_TEMP/offline-install.sh"
          cat "$RUNNER_TEMP/offline-install.sh"
          bash -euo pipefail "$RUNNER_TEMP/offline-install.sh"
      - name: Start without a registry
        run: cd ~/sard && docker compose up -d --wait --pull never
      - run: scripts/smoke-server.sh ~/sard/.env "$VERSION"
      - if: failure()
        run: cd ~/sard && docker compose logs --no-color
