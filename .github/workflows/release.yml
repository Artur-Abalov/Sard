# Copyright 2026 Artur Abalov
#
# Release of a version tag (v0.0.1, v0.0.1-rc.1):
#   1. image     sard-server for linux/amd64 and linux/arm64 -> ghcr.io
#   2. offline   docker save of sard-server + PostgreSQL per architecture
#   3. release   GitHub Release: offline archives, compose file, env template,
#                SHA256SUMS (a tag with "-" is a pre-release)
#   4. verify    on clean runners of both architectures: the README quickstart
#                against the published image, and the offline archive with
#                no registry pulls; scripts/smoke-server.sh checks both, console
#                page and its version included (ADR 0037).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/artur-abalov/sard-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z[-pre]" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # The runtime stage runs useradd for arm64; the jar is built natively (console included:
      # the Dockerfile's "web" stage runs on the builder's platform too).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # X.Y.Z always; X.Y and latest only for a release, never a pre-release.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SARD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sard-server-release
          cache-to: type=gha,scope=sard-server-release,mode=max

  offline:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/offline-archive.sh "${{ needs.image.outputs.version }}" "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [image, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          path: dist
          merge-multiple: true
      - name: Compose file and env template of this version
        run: |
          cp deploy/docker-compose.yml dist/docker-compose.yml
          sed "s/^SARD_VERSION=.*/SARD_VERSION=${{ needs.image.outputs.version }}/" \
            deploy/.env.example >dist/sard.env.example
          grep -qx "SARD_VERSION=${{ needs.image.outputs.version }}" dist/sard.env.example
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${prerelease[@]}" \
            --verify-tag --generate-notes --title "Sard $GITHUB_REF_NAME"

  verify-quickstart:
    # The README quickstart, run verbatim (only SARD_TAG is set to this tag)
    # on a clean runner with Docker, anonymously against the public registry.
    needs: [image, release]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract the quickstart from README.md
        run: |
          awk '/<!-- quickstart:begin -->/{f=1; next} /<!-- quickstart:end -->/{f=0} f' README.md \
            | awk '/^```bash$/{f=1; next} /^```$/{f=0} f' \
            | sed "s/^SARD_TAG=.*/SARD_TAG=$GITHUB_REF_NAME/" >"$RUNNER_TEMP/quickstart.sh"
          grep -q "^SARD_TAG=$GITHUB_REF_NAME$" "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
      - name: Run the quickstart
        run: |
          start=$(date +%s)
          bash -euo pipefail "$RUNNER_TEMP/quickstart.sh"
          echo "quickstart took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: scripts/smoke-server.sh ~/sard/.env "${{ needs.image.outputs.version }}"
      - if: failure()
        run: cd ~/sard && docker compose logs --no-color

  verify-offline:
    # The offline archive from the release: checksums, docker load, start
    # with --pull never, so not a single image comes from a registry.
    needs: [image, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the release assets
        run: |
          mkdir -p "$RUNNER_TEMP/offline" && cd "$RUNNER_TEMP/offline"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "sard-$VERSION-images-linux-${{ matrix.arch }}.tar.gz" \
            --pattern docker-compose.yml --pattern sard.env.example --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Load and start without a registry
        working-directory: ${{ runner.temp }}/offline
        run: |
          gunzip -c "sard-$VERSION-images-linux-${{ matrix.arch }}.tar.gz" | docker load
          cp sard.env.example .env
          sed -i -e "s/^SARD_DB_PASSWORD=.*/SARD_DB_PASSWORD=$(openssl rand -hex 24)/" \
                 -e "s/^SARD_ADMIN_PASSWORD=.*/SARD_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose up -d --wait --pull never
      - run: scripts/smoke-server.sh "$RUNNER_TEMP/offline/.env" "$VERSION"
      - if: failure()
        working-directory: ${{ runner.temp }}/offline
        run: docker compose logs --no-color
