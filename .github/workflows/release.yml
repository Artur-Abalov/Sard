# Copyright 2026 Artur Abalov
#
# Release for a tag vX.Y.Z or a pre-release vX.Y.Z-<pre> such as v0.0.1-rc.1
# (docs/adr/0043-agent-release.md, ADR 0039):
#
#   build ×2 ─┬─ reproduce  (two independent builds, same SHA256SUMS; tamper tests)
#   server-jar┼─ install    (deb on Debian/Ubuntu with systemd: install, enroll, upgrade)
#             └─ e2e        (test/e2e against the image of these packages and this jar)
#                   └─ sign     (environment "release": the only job that sees the key)
#                         ├─ publish  (GitHub release with the signed files; "-" makes it a pre-release)
#                         └─ image    (sard-server for amd64 and arm64: the tested jar, console
#                               │      included, and the signed packages; sard-agent of the same
#                               │      signed tarballs, the agent next to the server; GHCR)
#                               └─ offline ×2 (docker save of sard-server, sard-agent + PostgreSQL per arch)
#                                     └─ server-assets (offline archives, compose file, env
#                                           │           template, SHA256SUMS.server → the release)
#                                           ├─ verify-quickstart ×2 (README quickstart, clean runner)
#                                           └─ verify-offline ×2    (archive, --pull never)
#
# Build once, test that (docs/adr/0045-build-once.md): the packages of "build a"
# and the jar of "server-jar" are what install and e2e test, what sign signs and
# what image publishes; no later job compiles either again. "build b" exists only
# to prove the packages reproducible; dist-old in install is a fixture (an older
# version to upgrade from), and so is the e2e stand's agent (ADR 0036).
# The signed SHA256SUMS covers the agent packages only; the server assets have
# their own SHA256SUMS.server. The image carries the signed packages, and the
# server serves them (docs/release.md).
# Trust: the minisign key is a secret of the "release" environment, which only
# v* tags may use and which waits for the owner's approval. Pull requests
# (from forks too) never run this workflow; no job uses pull_request_target.
# Every third-party action is pinned to a commit; the signing job runs only
# minisign from the runner's apt and scripts/release-sign.sh of the tagged
# commit. Anyone who can push a v* tag or change main can change what is
# signed: both are restricted to the owner (docs/release.md).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.build }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        build: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - name: rpm and gpg
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg
      # restic's release key, accepted only if it has the fingerprint pinned in
      # agent/internal/restic/restic-version (ADR 0017): fetch-restic.sh checks the signer.
      - name: restic signing key
        run: cp agent/internal/restic/restic-signing-key.asc "$RUNNER_TEMP/restic.asc"
      - name: package
        env:
          REQUIRE_RPM: "1"
          REQUIRE_SIGNATURE: "1"
          RESTIC_SIGNING_KEY: ${{ runner.temp }}/restic.asc
        run: make package VERSION="$VERSION"
      # Never shipped: the T3 e2e classes run it (ADR 0036).
      - name: e2e stand's agent
        if: matrix.build == 'a'
        run: make package-stand VERSION="$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.build == 'a'
        with:
          name: stand
          path: test/e2e/build/stand-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.build }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error

  # The only build of the server jar (console included) of this release.
  server-jar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: server jar
        run: make server-jar VERSION="$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-jar
          path: build/server-jar/sard-server.jar
          if-no-files-found: error

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-*
          path: builds
      - name: two builds, one SHA256SUMS
        run: diff builds/dist-a/SHA256SUMS builds/dist-b/SHA256SUMS
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: forgeries are refused (throwaway key)
        run: scripts/test-release-signing.sh builds/dist-a "$VERSION"

  install:
    needs: [build, server-jar]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-a
          path: dist-new
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-jar
          path: build/server-jar
      # The version upgraded from: the same commit as an older package
      # (0.0.0~dev… sorts below any release), so the upgrade path is this
      # release's own install and remove scripts.
      - name: package to upgrade from
        run: make package DIST="$PWD/dist-old" VERSION=upgrade-base
      - name: server image of the release's jar and packages
        run: make server-image DIST=dist-new SERVER_IMAGE=sard-server:e2e VERSION="$VERSION"
      - name: install, enroll, upgrade
        run: OLD_DIST=dist-old NEW_DIST=dist-new scripts/test-agent-install.sh "${{ matrix.distro }}"
      # The commands the console shows (U1b), run as the server answers them.
      - name: install and upgrade by the console's steps
        run: |
          scripts/test-console-install.sh "${{ matrix.distro }}"
          UPGRADE=1 OLD_DIST=dist-old scripts/test-console-install.sh "${{ matrix.distro }}"

  e2e:
    needs: [build, server-jar]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Kotlin test class file names are Cyrillic; the JVM takes the file-name encoding from the locale.
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-a
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stand
          path: test/e2e/build/stand-dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-jar
          path: build/server-jar
      - name: images of the release's jar and packages
        run: make e2e-assemble DIST=dist VERSION="$VERSION"
      - name: e2e tests
        run: make e2e-test VERSION="$VERSION"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            test/e2e/build/e2e-logs/
            test/e2e/build/reports/tests/
          if-no-files-found: ignore

  sign:
    needs: [reproduce, install, e2e]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-a
          path: dist
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: scripts/release-sign.sh dist "$VERSION"
      - name: verify with the published key
        run: scripts/release-verify.sh dist "$VERSION" deploy/release/sard-release.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: verify again
        run: scripts/release-verify.sh dist "$VERSION" deploy/release/sard-release.pub
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" "${prerelease[@]}" \
            --notes "Signed with the Sard release key (deploy/release/sard-release.pub, docs/release.md). Verify: minisign -Vm SHA256SUMS -p sard-release.pub && sha256sum -c SHA256SUMS" \
            dist/*

  image:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: verify again
        run: scripts/release-verify.sh dist "$VERSION" deploy/release/sard-release.pub
      # The jar install and e2e tested: the image is assembled from it, nothing is compiled.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-jar
          path: build/server-jar
      # vX.Y.Z-pre and X.Y.Z-pre always; X.Y and latest only for a release.
      - name: image tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sard-server"
          agent="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sard-agent"
          plain="${VERSION#v}"
          tags="$image:$VERSION,$image:$plain"
          agent_tags="$agent:$VERSION,$agent:$plain"
          if [[ "$VERSION" != *-* ]]; then
            tags="$tags,$image:${plain%.*},$image:latest"
            agent_tags="$agent_tags,$agent:${plain%.*},$agent:latest"
          fi
          { echo "IMAGE=$image"; echo "TAGS=$tags"; echo "AGENT_IMAGE=$agent"; echo "AGENT_TAGS=$agent_tags"; } >>"$GITHUB_ENV"
      # The runtime stage runs useradd for arm64; the package check runs once,
      # natively, and the jar comes from the server-jar job (deploy/server/Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The server hands out exactly these signed files (deploy/server/Dockerfile).
      - name: build and push sard-server for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SARD_VERSION=${{ env.VERSION }}
          build-contexts: server-jar=build/server-jar
          push: true
          tags: ${{ env.TAGS }}
      - name: the published image carries the signed packages, on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint test "$IMAGE:$VERSION" \
              -f /usr/share/sard/agent-packages/SHA256SUMS.minisig
          done
      # The agent next to the server in docker-compose.yml (docs/operations/self-agent.md):
      # the same version, unpacked from the signed tarballs verified above.
      - name: build and push sard-agent for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: deploy/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SARD_VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.AGENT_TAGS }}
      - name: the published agent image is this version, on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$AGENT_IMAGE:$VERSION" --version | grep -qx "sard-agent $VERSION"
          done

  offline:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/offline-archive.sh "${VERSION#v}" "${{ matrix.arch }}" offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-${{ matrix.arch }}
          path: offline/
          if-no-files-found: error

  server-assets:
    needs: [publish, offline]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: offline-*
          path: assets
          merge-multiple: true
      - name: compose file, env template of this version, checksums
        run: |
          cp deploy/docker-compose.yml assets/docker-compose.yml
          sed "s/^SARD_VERSION=.*/SARD_VERSION=${VERSION#v}/" deploy/.env.example >assets/sard.env.example
          grep -qx "SARD_VERSION=${VERSION#v}" assets/sard.env.example
          (cd assets && sha256sum -- * >SHA256SUMS.server && cat SHA256SUMS.server)
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" assets/*

  verify-quickstart:
    # The README quickstart, run verbatim (only SARD_TAG is set to this tag)
    # on a clean runner with Docker, anonymously against the public registry.
    needs: server-assets
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the quickstart from README.md
        run: |
          awk '/<!-- quickstart:begin -->/{f=1; next} /<!-- quickstart:end -->/{f=0} f' README.md \
            | awk '/^```bash$/{f=1; next} /^```$/{f=0} f' \
            | sed "s/^SARD_TAG=.*/SARD_TAG=$VERSION/" >"$RUNNER_TEMP/quickstart.sh"
          grep -q "^SARD_TAG=$VERSION$" "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
      - name: Run the quickstart
        run: |
          start=$(date +%s)
          bash -euo pipefail "$RUNNER_TEMP/quickstart.sh"
          echo "quickstart took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: scripts/smoke-server.sh ~/sard/.env "$VERSION"
      - if: failure()
        run: cd ~/sard && docker compose logs --no-color

  verify-offline:
    # The offline archive from the release: checksums, docker load, start
    # with --pull never, so not a single image comes from a registry.
    needs: server-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release assets
        run: |
          mkdir -p "$RUNNER_TEMP/offline" && cd "$RUNNER_TEMP/offline"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "sard-${VERSION#v}-images-linux-${{ matrix.arch }}.tar.gz" \
            --pattern docker-compose.yml --pattern sard.env.example --pattern SHA256SUMS.server
          sha256sum --check --ignore-missing SHA256SUMS.server
      - name: Load and start without a registry
        working-directory: ${{ runner.temp }}/offline
        run: |
          gunzip -c "sard-${VERSION#v}-images-linux-${{ matrix.arch }}.tar.gz" | docker load
          cp sard.env.example .env
          sed -i -e "s/^SARD_DB_PASSWORD=.*/SARD_DB_PASSWORD=$(openssl rand -hex 24)/" \
                 -e "s/^SARD_ADMIN_PASSWORD=.*/SARD_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose up -d --wait --pull never
      - run: scripts/smoke-server.sh "$RUNNER_TEMP/offline/.env" "$VERSION"
      - if: failure()
        working-directory: ${{ runner.temp }}/offline
        run: docker compose logs --no-color
