#
# Every job runs the same quality gate as a developer does locally
# (scripts/gate.sh, thresholds defined there).
name: CI

# A change that touches only documentation runs no job: nothing in the
# gates reads docs/ or Markdown (license-check skips them too).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make license-check

  proto:
    runs-on: ubuntu-latest
    env:
      # buf breaking: a PR is checked against its base, a push against the previous tip.
      # The first push of a branch has an all-zero "before"; it is compared with itself.
      PROTO_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      # buf lint, buf breaking, and `buf generate` must not change the committed proto/gen/go.
      - run: ./scripts/gate.sh proto
      - run: ./scripts/gate.sh gen

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [sdk, agent, cli, tools]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/gate.sh ${{ matrix.module }}
      - name: Build binaries
        if: matrix.module == 'agent' || matrix.module == 'cli'
        run: |
          make build-${{ matrix.module }}
          if [ "${{ matrix.module }}" = agent ]; then ./agent/bin/sard-agent --version; else ./cli/bin/sardctl version; fi
      - name: Package the agent with restic (tar.gz, deb, rpm)
        if: matrix.module == 'agent'
        run: make package
      - uses: actions/upload-artifact@v7
        if: matrix.module == 'agent'
        with:
          name: sard-agent-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  server:
    runs-on: ubuntu-latest
    env:
      # Kotlin test class file names come from Cyrillic spec-quoted titles; the
      # JVM derives file-name encoding (sun.jnu.encoding) from the process
      # locale only, never from JVM flags.
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      # Testcontainers uses the runner's Docker.
      - run: ./scripts/gate.sh server
      - name: OpenAPI document used by the web client is up to date
        run: |
          cp server/build/openapi/openapi.json web/src/api/openapi.json
          git diff --exit-code -- web/src/api/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Generated API client matches openapi.json
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Generated route tree matches src/routes
        working-directory: web
        run: |
          npm run gen:routes
          git diff --exit-code -- src/routeTree.gen.ts
      - run: ./scripts/gate.sh web

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sard-server image
        run: docker build -f deploy/server/Dockerfile -t sard-server:ci .

  e2e:
    # End-to-end tests (test/e2e): PostgreSQL, sard-server and sard-agent as
    # containers built from this commit. Logs of every container of a failed
    # test, secrets masked, are uploaded as an artifact.
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-buildx-action@v3
      # Lets `docker buildx build` in the Makefile reach the GitHub Actions cache.
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: make e2e
        run: >-
          make e2e
          E2E_SERVER_BUILD_FLAGS="--cache-from type=gha,scope=sard-server-e2e
          --cache-to type=gha,scope=sard-server-e2e,mode=max"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            test/e2e/build/e2e-logs/
            test/e2e/build/reports/tests/
          if-no-files-found: ignore
