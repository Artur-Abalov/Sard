# Copyright 2026 Artur Abalov
#
# Every job runs the same quality gate as a developer does locally
# (scripts/gate.sh, thresholds defined there).
#
# Build once, test that (docs/adr/0045-build-once.md): every shipped artifact
# is built by exactly one job and handed on as a workflow artifact; the jobs
# that test it download it and build nothing of it again.
#
#   packages ──┬── server        seam tests run the packaged agent
#              ├── server-image  jar once (console included), image from that jar
#              ├──────┼── e2e          that image; agent images from the packages
#              └──────┴── install-rpm  the rpm on Rocky 9 with systemd
name: CI

# A change that touches only documentation runs no job: nothing in the
# gates reads docs/ or Markdown (license-check skips them too).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# One version for every artifact of a run: the packages, the jar and the
# images agree on it, and the image refuses packages of another version.
env:
  VERSION: ${{ github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make license-check

  proto:
    runs-on: ubuntu-latest
    env:
      # buf breaking: a PR is checked against its base, a push against the previous tip.
      # The first push of a branch has an all-zero "before"; it is compared with itself.
      PROTO_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      # buf lint, buf breaking, and `buf generate` must not change the committed proto/gen/go.
      - run: ./scripts/gate.sh proto
      - run: ./scripts/gate.sh gen

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [sdk, agent, cli, tools]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/gate.sh ${{ matrix.module }}
      # The agent is built for shipping by the packages job only.
      - name: Build sardctl
        if: matrix.module == 'cli'
        run: |
          make build-cli
          ./cli/bin/sardctl version

  packages:
    # The only build of sard-agent in this workflow: the release packages every
    # later job tests, plus the e2e stand's build (GO_TAGS=e2e, ADR 0036), which
    # only the T3 e2e classes run and which is never shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - name: rpm and minisign
        run: sudo apt-get update && sudo apt-get install -y rpm minisign
      # One rule from a tag to every version; dpkg and rpm order pre-releases
      # below their release (docs/adr/0048-release-versions.md).
      - name: Release version rule
        run: scripts/test-release-version.sh
      # The helper that scripts use to go through the first-start wizard by the code from the log (F4a).
      - name: Setup wizard helper
        run: scripts/test-setup-wizard.sh
      - name: Package the agent with restic (tar.gz, deb, rpm; amd64 and arm64)
        env:
          REQUIRE_RPM: "1"
        run: make package
      - name: The packaged agent reports the version it was built with
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          tar -xzf "dist/sard-agent_${VERSION}_linux_amd64.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/agent"
          test "$("$RUNNER_TEMP/agent/sard-agent" --version)" = "sard-agent $VERSION"
      # The release signature refuses forgeries (docs/adr/0043-agent-release.md);
      # a throwaway key, the real one is used by release.yml only.
      - name: Release signature checks
        run: scripts/test-release-signing.sh dist "$VERSION"
      # The image carries the agent packages of its own version (docs/adr/0043-agent-release.md).
      - name: The image refuses agent packages of another version or not matching SHA256SUMS
        run: scripts/test-image-packages.sh "$VERSION"
      - name: The e2e stand's agent packages
        run: make package-stand
      - uses: actions/upload-artifact@v7
        with:
          name: sard-agent-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: sard-agent-stand
          path: test/e2e/build/stand-dist/
          if-no-files-found: error

  server:
    needs: packages
    runs-on: ubuntu-latest
    env:
      # Kotlin test class file names come from Cyrillic spec-quoted titles; the
      # JVM derives file-name encoding (sun.jnu.encoding) from the process
      # locale only, never from JVM flags.
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v7
        with:
          name: sard-agent-packages
          path: dist
      # The seam tests run the packaged agent instead of building their own (server/build.gradle.kts).
      - name: The agent of the packages for the seam tests
        run: |
          mkdir -p "$RUNNER_TEMP/seam-agent"
          tar -xzf "dist/sard-agent_${VERSION}_linux_amd64.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/seam-agent"
          {
            echo "ORG_GRADLE_PROJECT_sardTestAgentBinary=$RUNNER_TEMP/seam-agent/sard-agent"
            echo "ORG_GRADLE_PROJECT_sardTestAgentVersion=$VERSION"
          } >>"$GITHUB_ENV"
      # Testcontainers uses the runner's Docker.
      - run: ./scripts/gate.sh server
      - name: OpenAPI document used by the web client is up to date
        run: |
          cp server/build/openapi/openapi.json web/src/api/openapi.json
          git diff --exit-code -- web/src/api/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Generated API client matches openapi.json
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Generated route tree matches src/routes
        working-directory: web
        run: |
          npm run gen:routes
          git diff --exit-code -- src/routeTree.gen.ts
      - run: ./scripts/gate.sh web

  server-image:
    # The only build of the server jar (console included, ADR 0040) in this
    # workflow, from deploy/server/Dockerfile as release.yml builds it. Every
    # image below is assembled from that jar and the packages: both
    # architectures, so a Dockerfile change that breaks arm64 fails here, not on
    # a tag, and the amd64 image the e2e job runs.
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Lets `docker buildx build` in the Makefile reach the GitHub Actions cache.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: actions/download-artifact@v7
        with:
          name: sard-agent-packages
          path: dist
      - name: Server jar
        run: >-
          make server-jar
          SERVER_BUILD_FLAGS="--cache-from type=gha,scope=sard-server
          --cache-to type=gha,scope=sard-server,mode=max"
      - name: sard-server for amd64 and arm64 from that jar
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --build-context server-jar=build/server-jar
          --build-arg SARD_VERSION="$VERSION" -f deploy/server/Dockerfile .
      - name: sard-server for the e2e tests
        run: |
          make server-image SERVER_IMAGE=sard-server:e2e
          docker save -o "$RUNNER_TEMP/sard-server-image.tar" sard-server:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: sard-server-jar
          path: build/server-jar/sard-server.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: sard-server-image
          path: ${{ runner.temp }}/sard-server-image.tar
          if-no-files-found: error
      # The template has no administrator password: the first start asks for it (F4a).
      - name: Compose files resolve with the env template
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config --quiet
          env SARD_VERSION=ci docker compose -f deploy/docker-compose.yml \
            -f deploy/docker-compose.build.yml --env-file deploy/.env.example config --quiet

  e2e:
    # End-to-end tests (test/e2e): PostgreSQL, the sard-server image of the
    # server-image job and agent images of the packages job; nothing of them is
    # built here. Logs of every container of a failed test, secrets masked, are
    # uploaded as an artifact.
    needs: [packages, server-image]
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v7
        with:
          name: sard-agent-packages
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: sard-agent-stand
          path: test/e2e/build/stand-dist
      - uses: actions/download-artifact@v7
        with:
          name: sard-server-image
          path: ${{ runner.temp }}
      - name: Images
        run: |
          docker load -i "$RUNNER_TEMP/sard-server-image.tar"
          make e2e-agent-images e2e-pg-agent-images DIST=dist
      - run: make e2e-test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            test/e2e/build/e2e-logs/
            test/e2e/build/reports/tests/
          if-no-files-found: ignore

  install-rpm:
    # The rpm installed, enrolled and upgraded on Rocky 9
    # with systemd, as release.yml's install job does on a tag (ADR 0048): here
    # so that a pull request sees it. This workflow's packages are a
    # development version (0.0.0~dev.<sha>), which no fixed fixture sorts below
    # in both dpkg and rpm; so the packaged rpm is installed and a fixture of
    # the same commit, v99.0.0, is the upgrade: the shipped package's install,
    # and its scripts on upgrade, run.
    needs: [packages, server-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ["rockylinux/rockylinux:9"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v7
        with:
          name: sard-agent-packages
          path: dist-old
      - uses: actions/download-artifact@v7
        with:
          name: sard-server-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/sard-server-image.tar"
      - name: rpm
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: package to upgrade to
        env:
          REQUIRE_RPM: "1"
        run: make package DIST="$PWD/dist-new" ARCHES=amd64 VERSION=v99.0.0
      - name: install, enroll, upgrade
        run: OLD_DIST=dist-old NEW_DIST=dist-new scripts/test-agent-install.sh "${{ matrix.distro }}"

