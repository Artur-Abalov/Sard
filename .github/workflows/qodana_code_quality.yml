#
# Qodana (JetBrains cloud), paused (SC1): it does not work properly yet, so it
# runs only by hand. Before it runs on pull requests again it keeps these
# rights: a read-only token, no credentials left in the checkout; its token is
# a repository secret, so a pull request from a fork never gets it.
name: Qodana
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a full history is required for the analysis
          persist-credentials: false
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_229745042 }}
          QODANA_ENDPOINT: "https://qodana.cloud"
