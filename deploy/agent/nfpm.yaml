#
# deb/rpm description for sard-agent, used by scripts/package-agent.sh.
# ${STAGE}, ${ARCH}, ${PKG_VERSION} and ${ROOT} are filled in by the script.
name: sard-agent
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
section: admin
priority: optional
maintainer: Artur Abalov <107027139+Artur-Abalov@users.noreply.github.com>
description: |
  Sard backup agent. Dials out to sard-server, runs backups and restores
  with the bundled restic. Opens no listening ports.
vendor: Sard
homepage: https://github.com/Artur-Abalov/sard
license: AGPL-3.0-only AND BSD-2-Clause

# restic's sftp backend runs the system ssh client (docs/adr/0047-e2e-storage-backends.md).
# Optional: the postgresql plugin runs the host's pg_dump and psql (F1 ПГ21,
# docs/plugins/postgresql.md). An agent without databases needs no client,
# so there is no hard dependency; the names differ between the families.
overrides:
  deb:
    depends:
      - openssh-client
    suggests: [postgresql-client]
  rpm:
    depends:
      - openssh-clients
    suggests: [postgresql]

contents:
  # restic is found next to sard-agent (docs/adr/0017-restic-shipped-with-agent.md).
  - src: ${STAGE}/sard-agent
    dst: /usr/libexec/sard/sard-agent
    file_info: {mode: 0755}
  - src: ${STAGE}/restic
    dst: /usr/libexec/sard/restic
    file_info: {mode: 0755}
  - src: /usr/libexec/sard/sard-agent
    dst: /usr/bin/sard-agent
    type: symlink
  - src: ${STAGE}/sard-agent.service
    dst: /usr/lib/systemd/system/sard-agent.service
    file_info: {mode: 0644}
  - src: ${STAGE}/agent.example.yaml
    dst: /etc/sard/agent.example.yaml
    type: config|noreplace
    file_info: {mode: 0644}
  # Licenses are plain files: nfpm leaves "license" and "doc" entries out of a deb.
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/sard-agent/LICENSE
    file_info: {mode: 0644}
  - src: ${STAGE}/LICENSE.restic
    dst: /usr/share/doc/sard-agent/LICENSE.restic
    file_info: {mode: 0644}
  - src: ${STAGE}/THIRD_PARTY_LICENSES
    dst: /usr/share/doc/sard-agent/THIRD_PARTY_LICENSES
    file_info: {mode: 0644}
  - src: ${STAGE}/NOTICE
    dst: /usr/share/doc/sard-agent/NOTICE
    file_info: {mode: 0644}

scripts:
  postinstall: ${ROOT}/deploy/agent/postinstall.sh
  preremove: ${ROOT}/deploy/agent/preremove.sh

# Reproducible builds: file and package times come from SOURCE_DATE_EPOCH,
# the build host is fixed (scripts/package-agent.sh).
rpm:
  buildhost: sard-release
