# /etc/sard/agent.yaml — sard-agent configuration.
#
# Trust model (docs/adr/0008-crypto-provider.md): repositories, secrets and
# scripts are defined here and stay on this host. The server refers to them
# by name only and never receives URLs, keys, passwords or script paths.
server:
  address: sard.example.com:9090
tls: # written by `sard-agent enroll` (docs/operations/agent-enroll.md), run
     # as the sard-agent user; deb/rpm create /etc/sard/tls for it
  ca_file: /etc/sard/tls/ca.pem
  cert_file: /etc/sard/tls/agent.pem
  key_file: /etc/sard/tls/agent.key
repositories:
  - name: main
    url: s3:https://s3.example.com/backups/db1
    password_file: /etc/sard/secrets/restic-main.pass # restic key, handed to restic by path
    env_file: /etc/sard/secrets/restic-main.env # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
secrets:
  pg-billing: /etc/sard/secrets/pg-billing      # referenced as "password_ref": "pg-billing"
scripts:
  app-maintenance: /usr/local/bin/app-maintenance
restic: # restic ships with the agent: docs/adr/0017-restic-shipped-with-agent.md
  # path: /usr/libexec/sard/restic    # default: "restic" next to the sard-agent binary
  cache_dir: /var/cache/sard/restic   # default; also restic's HOME. Under the packaged
                                      # systemd unit another path needs ReadWritePaths=
                                      # in a drop-in (see sard-agent.service). Not ssh's
                                      # home: sftp keys and known_hosts are in
                                      # /var/lib/sard-agent/.ssh (docs/operator/05a-storage.md).
executor:
  state_dir: /var/lib/sard-agent/executor  # default; results wait here (0700) until the server acks them
  max_parallel: 1                          # steps running at once; default 1
