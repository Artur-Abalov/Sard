# Who may connect to the postgres service of deploy/docker-compose.yml, and how (DB2, docs/adr/0069-database-roles.md):
# the local socket without a password (an administrator's way in, and db-init's), the superuser sard never over the
# network, everyone else with a SCRAM password.
local all all trust
host all sard all reject
host all all all scram-sha-256
