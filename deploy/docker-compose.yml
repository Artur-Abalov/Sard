# Local stack: PostgreSQL + sard-server. Secrets come from deploy/.env
# (copy deploy/.env.example); make up does that on first run.
name: sard

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sard
      POSTGRES_USER: sard
      POSTGRES_PASSWORD: ${SARD_DB_PASSWORD:?set SARD_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sard -d sard"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: sard-server:dev
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
      args:
        # The agent packages in dist/ must be of this version (make up passes it).
        SARD_VERSION: ${SARD_VERSION:-dev}
    environment:
      SARD_DB_URL: jdbc:postgresql://postgres:5432/sard
      SARD_DB_USER: sard
      SARD_DB_PASSWORD: ${SARD_DB_PASSWORD:?set SARD_DB_PASSWORD in deploy/.env}
      SARD_PKI_SERVER_NAMES: ${SARD_PKI_SERVER_NAMES:-localhost,127.0.0.1,::1}
      # The single administrator's password (ADR 0020); at least 12 Unicode code points,
      # or the server refuses to start. make up generates one on the first run.
      SARD_ADMIN_PASSWORD: ${SARD_ADMIN_PASSWORD:?set SARD_ADMIN_PASSWORD in deploy/.env}
      # Address agents dial (decision 5, S2b); unset means the first of the names above and the gRPC port.
      SARD_AGENT_ENDPOINT: ${SARD_AGENT_ENDPOINT:-}
      # Telegram notifications (S9a); both empty means notifications are off, with a warning.
      SARD_TELEGRAM_BOT_TOKEN: ${SARD_TELEGRAM_BOT_TOKEN:-}
      SARD_TELEGRAM_CHAT_ID: ${SARD_TELEGRAM_CHAT_ID:-}
      SARD_CONSOLE_PUBLIC_URL: ${SARD_CONSOLE_PUBLIC_URL:-}
      SARD_NOTIFY_LANGUAGE: ${SARD_NOTIFY_LANGUAGE:-}
      # /downloads/agent/: the agent packages baked into the image (docs/release.md).
      SARD_AGENT_DOWNLOADS: ${SARD_AGENT_DOWNLOADS:-true}
    volumes:
      # The CA key: its own volume, backed up apart from postgres-data (docs/operations/pki.md).
      - sard-pki:/var/lib/sard/pki
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The JRE image has bash but no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

volumes:
  postgres-data:
  sard-pki:
