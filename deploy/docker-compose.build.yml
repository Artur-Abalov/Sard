# Local development: build sard-server and sard-agent from this checkout instead
# of pulling the published images. make up adds this file on top of docker-compose.yml.
services:
  server:
    image: sard-server:dev # allow-unpinned: built from this checkout by this file
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
      args:
        # The agent packages in dist/ must be of this version (make up passes it).
        SARD_VERSION: ${SARD_VERSION:-dev}
  self-agent:
    image: sard-agent:dev-pg18 # allow-unpinned: built from this checkout by this file
    build:
      # The tarballs of make package (dist/), every architecture; the image takes its own.
      context: ../dist
      dockerfile: ../deploy/agent/Dockerfile
      args:
        SARD_VERSION: ${SARD_VERSION:-dev}
        # The pinned base: deploy/postgres.env, which the Makefile exports; the default is its copy
        # (DeployPostgresTest), so the file resolves without make too.
        BASE_IMAGE: ${SARD_AGENT_PG_BASE_IMAGE:-postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6}
