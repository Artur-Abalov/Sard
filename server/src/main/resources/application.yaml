# Secrets come from the environment (see deploy/.env.example), never from this file.
spring:
  application:
    name: sard-server
  datasource:
    url: ${SARD_DB_URL:jdbc:postgresql://localhost:5432/sard}
    # The server is sard_app (DB2, docs/operator/16-postgresql.md): it reads and writes rows and changes no schema.
    username: ${SARD_DB_USER:sard_app}
    # SARD_DB_PASSWORD_FILE, a file of a volume, takes precedence (dev.sard.server.database.DatabasePasswordFile).
    password: ${SARD_DB_PASSWORD:}
    hikari:
      # Whatever role it connects as, every session of the server works in the schema of Sard.
      schema: sard
  flyway:
    # The server never migrates (the migrate step does, as sard_migrator): Flyway here only reads the history, in the
    # schema the pool works in (sard), and the server refuses to start on a database whose migrations are not all
    # applied (dev.sard.server.persistence.DatabaseVersionConfiguration). There are no callbacks to look for, and the
    # search for them would take a second connection of the pool for nothing.
    skip-default-callbacks: true
  mvc:
    # Errors are application/problem+json (RFC 9457), the format of the REST contract.
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  grpc:
    server:
      port: ${SARD_GRPC_PORT:9090}
      # TLS always (ADR 0014). Client certificates are optional at the handshake so that
      # EnrollmentService works without one; AgentService requires one in its interceptor.
      # secure: presented client certificates are checked against the Sard CA.
      ssl:
        bundle: sard-grpc
        client-auth: optional
        secure: true
      # Reflection would list every service to a caller without a certificate.
      reflection:
        enabled: false
      # Agents ping every 30 s on their Connect stream (A3); the grpc-java default permits one
      # ping per 5 min and closes the connection with too_many_pings. The server pings too, so
      # a half-dead connection is closed within time + timeout (S5a, ADR 0026 stream manager).
      keepalive:
        time: 30s
        timeout: 10s
        permit:
          time: 20s
          without-calls: true
server:
  port: ${SARD_HTTP_PORT:8080}
  # Behind a TLS-terminating reverse proxy (Cloudflare Tunnel, nginx, Caddy): native takes the scheme and
  # the client address from X-Forwarded-Proto and X-Forwarded-For of a proxy on a loopback or private
  # address (ADR 0046). none (default) ignores those headers; other values are not supported.
  forward-headers-strategy: ${SARD_FORWARD_HEADERS:none}
sard:
  pki:
    # Holds the CA key; back it up separately from the database (docs/operations/pki.md).
    dir: ${SARD_PKI_DIR:/var/lib/sard/pki}
    server-names: ${SARD_PKI_SERVER_NAMES:localhost,127.0.0.1,::1}
    # A CA to take at the first start, when dir holds none: <import-dir>/ca/ca.crt and ca.key, owner-only
    # (docs/operator/08-migrate-and-remove.md, ADR 0052). Empty means: generate a new CA.
    import-dir: ${SARD_PKI_IMPORT_DIR:}
  agent-packages:
    # /downloads/agent/: the agent packages of this server's version, baked into the image
    # (docs/adr/0043-agent-release.md). On without a valid release, the server does not start.
    enabled: ${SARD_AGENT_DOWNLOADS:true}
    dir: ${SARD_AGENT_PACKAGES_DIR:/usr/share/sard/agent-packages}
    # Where hosts fetch the packages from, as in the install commands of the console (U1b). An absolute http or
    # https address without a query or a fragment; the server does not start with anything else. Empty means:
    # http, the host of the address agents dial (SARD_AGENT_ENDPOINT) and SARD_HTTP_PORT. Never taken from
    # request headers.
    downloads-url: ${SARD_AGENT_DOWNLOADS_URL:}
  self-agent:
    # The channel shared with the agent next to the server (sard-self): the server writes the agent's enrollment
    # token there (docs/operations/self-agent.md). Empty
    # switches the whole mechanism off; set but unusable, the server does not start.
    dir: ${SARD_SELF_DIR:}
    # How often the server checks that the built-in agent has a token to enroll with, or is enrolled already.
    # A positive duration; the server does not start with anything else.
    check-interval: ${SARD_SELF_CHECK_INTERVAL:15s}
  agent:
    # Address agents dial (decision 5, S2b); empty means: first of sard.pki.server-names and the gRPC port.
    endpoint: ${SARD_AGENT_ENDPOINT:}
    # How often agents send Heartbeat (Register hands it out, S4a); the stream manager counts in it (S5a).
    heartbeat-interval: ${SARD_AGENT_HEARTBEAT_INTERVAL:30s}
    stream:
      # A session that got a message within this many intervals is alive: a second stream is a duplicate.
      duplicate-window-heartbeats: 2
      # A session silent this many intervals is closed; its agent is offline.
      offline-after-heartbeats: 3
      hello-timeout: 30s
      send-queue: 64
      check-interval: 30s
      clock-skew-threshold: 30s
  run:
    dispatch:
      # A running step absent from the agent's Hello is lost after this many heartbeat intervals
      # without a result (S6a); the check runs every sard.agent.stream.check-interval unless
      # sard.run.dispatch.check-interval is set.
      lost-after-heartbeats: 2
      # After a server start no step in flight is lost sooner than this (the longer of it and the window above
      # counts): an agent backing off for its longest pause must find its step alive (OQ-138). A positive
      # duration; the server does not start with anything else.
      start-grace: ${SARD_RUN_START_GRACE:2m}
    progress:
      # Byte counters of one step reach the database at most this often; a new phase at once (S7a).
      write-interval: 5s
  logs:
    # Longer lines are cut and marked (bytes of UTF-8 text); past the step's total, one mark and
    # every later line of the step is dropped (S7a).
    max-line-bytes: 8192
    max-step-bytes: 16777216
    # step_logs has monthly partitions; the server keeps this many months ahead of the current one.
    partitions-ahead-months: 2
    partitions-check-interval: 1d
  retention:
    # How long the server keeps what it records (H1, phase 2). Global, not per tenant. Snapshots, the last success of
    # each kind of a source, the last passed and the last not passed verification, active runs and whatever a kept
    # row refers to are never deleted. Positive durations; the terms of runs, schedule fires and deliveries must be
    # longer than sard.notify.ttl, or the notification planner would make a deleted notification again. The server
    # does not start with anything else.
    # Log lines leave by whole monthly partitions, so the real term is 30 to 61 days.
    step-logs: 30d
    runs: 180d
    verifications: 180d
    schedule-fires: 180d
    notification-deliveries: 30d
    # The first pass is one interval after the start; a pass deletes in batches until nothing old is left.
    interval: 1h
    batch-size: 500
  metrics:
    # Prometheus metrics (H1, phase 3) on a listener of their own, not on the console's port: /actuator/health and
    # /actuator/info stay on SARD_HTTP_PORT, metrics are on no path of it. GET /metrics only (docs/operator/14-monitoring.md).
    # Inside the container by default: docker-compose does not publish the port. The server does not start with a
    # value it cannot work with, and the message names the variable.
    # An IPv4 or IPv6 address, never a name. Outside loopback (127.0.0.0/8, ::1), including 0.0.0.0 and ::, the
    # listener opens only with a token.
    bind: ${SARD_METRICS_BIND:127.0.0.1}
    # 1 to 65535, not the console's 8080 and not the agents' 9090.
    port: ${SARD_METRICS_PORT:8081}
    # Bearer token, at least 32 characters; empty means none. With a token every request needs it, on any address;
    # without one, loopback answers without authentication. It is never logged or shown in a label or in actuator.
    token: ${SARD_METRICS_TOKEN:}
    # How often the state gauges (last success of each source, agents, queues, certificates, self-backup) are read
    # from the database: the first time at the start, then this long after each reading. A scrape reads memory only.
    state-interval: ${SARD_METRICS_STATE_INTERVAL:60s}
  console:
    # Where people open the console, as the notification link: <address>/runs/<runId>. Empty means no link.
    # An absolute http or https address with a host, without a query or a fragment; the server does not
    # start with anything else (S9b, docs/operations/notifications.md). Never taken from request headers.
    public-url: ${SARD_CONSOLE_PUBLIC_URL:}
  notify:
    # The language of notification texts: en or ru; the server does not start with anything else (S9b).
    language: ${SARD_NOTIFY_LANGUAGE:en}
    # Notifications about finished runs (S9a). The Telegram bot comes from SARD_TELEGRAM_BOT_TOKEN
    # and SARD_TELEGRAM_CHAT_ID only, never from this file; without them notifications are off.
    # A background tick plans one delivery per finished run and channel, then sends what is due.
    tick-interval: 10s
    batch: 100
    # A delivery is held this long per attempt; a server that dies mid-send sends again after it.
    lease: 5m
    # 5xx, network and timeouts: initial-delay doubling up to max-delay, at most max-attempts.
    initial-delay: 10s
    max-delay: 10m
    max-attempts: 8
    # A 429 waits Telegram's retry_after, at most this long, and does not count as an attempt.
    max-retry-after: 1h
    # Runs finished longer ago are not told about; a delivery not made within it expires.
    ttl: 24h
    telegram:
      api-url: https://api.telegram.org
      connect-timeout: 5s
      request-timeout: 10s
logging:
  level:
    # At DEBUG Hibernate prints the whole state of every entity it flushes: a source's config and a
    # step's output would reach the log (S8b: config values never do). Its own diagnostics stay at INFO.
    org.hibernate.orm.core: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    # The exposition is served by sard.metrics.* and by nothing on the console's port (H1, phase 3).
    prometheus:
      access: none
springdoc:
  api-docs:
    path: /v3/api-docs
